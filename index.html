<style>
  :root {
    --bg: #F2F4FB;
    --surface: #FFFFFF;
    --surface-alt: #E7EAF6;
    --ink: #10131F;
    --ink-muted: #5B6180;
    --line: #D9DEF0;
    --coral: #FF5A3C;
    --coral-dim: #FFE6E0;
    --mint: #17B978;
    --mint-dim: #E1F7ED;
    --star: #C6902A;
    --font-display: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', monospace;
  }
  html[data-theme="dark"] {
    --bg: #0A0D18;
    --surface: #12162A;
    --surface-alt: #181D34;
    --ink: #ECEEFC;
    --ink-muted: #8890B8;
    --line: #262C48;
    --coral: #FF6A4D;
    --coral-dim: #3A2420;
    --mint: #22C77F;
    --mint-dim: #123324;
    --star: #E3B15B;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-display);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button, select, input { font-family: inherit; }
  table { border-collapse: collapse; width: 100%; }
  .mono { font-family: var(--font-mono); }
  .muted { color: var(--ink-muted); }
  .tabular { font-variant-numeric: tabular-nums; }
  .container { max-width: 960px; margin: 0 auto; padding: 0 20px; }
  .container-sm { max-width: 720px; margin: 0 auto; padding: 0 20px; }
  .container-xs { max-width: 480px; margin: 0 auto; padding: 0 20px; }
  .row { display: flex; align-items: center; }
  .between { justify-content: space-between; }
  .wrap { flex-wrap: wrap; }
  .gap-1 { gap: 6px; } .gap-2 { gap: 10px; } .gap-3 { gap: 14px; } .gap-4 { gap: 20px; }
  .icon { display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
  .pill {
    display: inline-flex; align-items: center; gap: 4px; border-radius: 3px;

  .pill.mint { background: var(--mint-dim); color: var(--mint); border-color: var(--mint); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;

  .btn-coral { background: var(--coral); color: #fff; }
  .btn-ink { background: var(--ink); color: var(--bg); }
  .btn-outline { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .card {
    border: 1px solid var(--line); background: var(--surface); border-radius: 3px; padding: 16px;

  .card:hover { border-color: var(--ink-muted); }
  .grid { display: grid; gap: 12px; }
  .grid-2 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 720px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
  @media (min-width: 721px) and (max-width: 900px) { .grid-3 { grid-template-columns: repeat(2,1fr); } }

  /* Nav */
  .navbar {
    position: sticky; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(6px);

  .brand { display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; color: var(--ink); }
  .brand span { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
  .nav-link { display: none; align-items: center; gap: 6px; font-size: 14px; padding: 6px 12px; border-radius: 3px; border: none; background: none; cursor: pointer; color: var(--ink-muted); }
  @media (min-width: 640px) { .nav-link { display: inline-flex; } .nav-cta { display: inline-flex !important; } }
  .nav-link.active { background: var(--surface-alt); color: var(--ink); }
  .badge-count { margin-left: 4px; border-radius: 999px; font-size: 10px; padding: 0 6px; background: var(--surface-alt); color: var(--ink); }
  .icon-btn { padding: 8px; border-radius: 3px; border: 1px solid var(--line); background: none; cursor: pointer; color: var(--ink); }
  .nav-cta { display: none; }

  /* Hero */
  .hero { padding: 64px 20px 64px; max-width: 720px; margin: 0 auto; }
  .hero h1 { font-size: 40px; line-height: 1.05; letter-spacing: -0.02em; font-weight: 600; margin: 0; }

  .hero p { margin-top: 18px; font-size: 16px; color: var(--ink-muted); max-width: 520px; }

  .search-form { margin-top: 34px; display: flex; flex-direction: column; gap: 8px; }

  .search-box { flex: 1; display: flex; align-items: center; gap: 10px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 3px; background: var(--surface); }

  .search-form button.btn { padding: 14px 24px; }
  @media (min-width: 640px) { .search-form button.btn { margin-left: 8px; } }
  .examples { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
  .example-chip { font-size: 14px; padding: 6px 12px; border-radius: 3px; border: 1px solid var(--line); background: none; cursor: pointer; color: var(--ink-muted); }

  /* Sections */
  .section { max-width: 960px; margin: 0 auto; padding: 56px 20px; border-top: 1px solid var(--line); }
  .section h2 { font-size: 20px; font-weight: 600; margin: 0; }
  .section-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; margin-bottom: 4px; }

  .card-price { font-family: var(--font-mono); font-size: 14px; font-weight: 600; margin-top: auto; }

  .step-num { font-family: var(--font-mono); font-size: 14px; color: var(--ink-muted); }
  .step-title { font-size: 18px; font-weight: 600; margin: 8px 0 6px; }

  @media (min-width: 640px) { .best-deal-price { font-size: 36px; } }
  .best-deal-meta { display: flex; flex-wrap: wrap; gap: 16px; font-size: 14px; color: var(--ink-muted); margin-top: 12px; }

  .savings-banner { background: var(--surface-alt); border-radius: 3px; padding: 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .savings-amount { font-family: var(--font-mono); color: var(--mint); font-size: 18px; font-weight: 600; }

  .comparison-table td { padding: 12px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: top; }
  .comparison-table td.num { text-align: right; font-family: var(--font-mono); }
  .table-wrap { overflow-x: auto; }
  .store-pills { display: flex; gap: 6px; margin-top: 6px; }
  .sort-select { font-size: 14px; padding: 6px 10px; border-radius: 3px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }

/* ======================================================================
   ICONS — plain glyphs standing in for a proper icon set. Simple choice
   for a dependency-free vanilla build.
   ====================================================================== */
const ICONS = {
  search: "🔍", moon: "🌙", sun: "☀️", check: "✓", link: "↗", sparkles: "✦",
  dashboard: "▦", star: "★", bookmark: "🔖", bookmarkFilled: "🔖", bell: "🔔",
  shield: "🛡", clock: "🕐", close: "✕",
  smartphone: "📱", laptop: "💻", headphones: "🎧", tv: "📺", watch: "⌚",
  gamepad: "🎮", tablet: "📱", camera: "📷",
};
function icon(name) { return `<span class="icon">${ICONS[name] || ""}</span>`; }

/* ======================================================================
   SIMULATED BACKEND — deterministic seeded generator standing in for
   real retailer APIs. Same product always returns the same numbers.
   ====================================================================== */
function seededRand(seedStr) {
  let h = 1779033703 ^ seedStr.length;
  for (let i = 0; i < seedStr.length; i++) {
    h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function () {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  };
}

const STORES = ["Amazon", "Noon", "Jumia", "B.TECH", "2B"];

const STORE_LINKS = {
  Amazon: (q) => `https://www.amazon.eg/s?k=${encodeURIComponent(q)}`,
  Noon: () => `https://www.noon.com/egypt-en/`,
  Jumia: () => `https://www.jumia.com.eg/`,
  "B.TECH": () => `https://btech.com/en`,
  "2B": () => `https://2b.com.eg/en`,
};

const WARRANTY = {
  Amazon: "Official manufacturer warranty",
  Noon: "Marketplace seller, no official warranty",
  Jumia: "Local distributor warranty, 6 months",
  "B.TECH": "Official warranty with in-store support",
  "2B": "Official warranty, 12 months",
};

function genRetailers(basePrice, seedStr) {
  const rand = seededRand(seedStr);
  const raw = STORES.map((store) => {
    const priceVar = (rand() - 0.45) * 0.16;
    const price = Math.max(50, Math.round((basePrice * (1 + priceVar)) / 10) * 10);
    const shipping = rand() < 0.5 ? 0 : Math.round((40 + rand() * 160) / 10) * 10;
    const delivery = Math.floor(rand() * 5);
    const rating = Math.round((3.6 + rand() * 1.3) * 10) / 10;
    return { store, price, shipping, delivery, rating };
  });
  const totals = raw.map((r) => r.price + r.shipping);
  const minT = Math.min(...totals);
  const maxT = Math.max(...totals);
  return raw.map((r, i) => {
    const total = totals[i];
    const priceScore = maxT === minT ? 88 : 100 - ((total - minT) / (maxT - minT)) * 38;
    const deliveryPenalty = r.delivery * 3;
    const ratingBonus = (r.rating - 4) * 12;
    const score = Math.max(52, Math.min(98, Math.round(priceScore - deliveryPenalty + ratingBonus)));
    return { ...r, score };
  });
}

function genHistory(basePrice, seedStr) {
  const rand = seededRand(seedStr + "-hist");
  const labels = ["30d","27d","24d","21d","18d","15d","12d","9d","6d","3d","Today"];
  let price = Math.round((basePrice * (1.05 + rand() * 0.08)) / 10) * 10;
  const prices = [];
  for (let i = 0; i < labels.length; i++) {
    if (i === labels.length - 1) { prices.push(basePrice); break; }
    prices.push(price);
    const drop = Math.round((basePrice * 0.006 + rand() * basePrice * 0.018) / 10) * 10;
    price = Math.max(basePrice, price - drop);
  }
  return { labels, prices };
}

function buildCatalog() {
  const products = {};
  Object.entries(CATEGORY_DEFS).forEach(([category, def]) => {
    def.items.forEach(([brand, model, base]) => {
      def.variants.forEach((variant) => {
        def.colors.forEach((color) => {
          const name = `${brand} ${model}`;
          const attrs = [variant.label, color, "New"].filter(Boolean);
          const rawId = slugify(`${name}-${variant.label || ""}-${color}`);
          let id = rawId, n = 1;
          while (products[id]) id = `${rawId}-${n++}`;
          const basePrice = Math.round((base * variant.mult) / 10) * 10;
          products[id] = {
            id, name, brand, category, attrs,
            icon: def.icon,
            checkedMinsAgo: 1 + Math.floor(seededRand(id + "-mins")() * 20),
            retailers: genRetailers(basePrice, id),
            history: genHistory(basePrice, id),
          };
        });
      });
    });
  });
  return products;
}

function annotate(product) {
  const rows = product.retailers.map((r) => ({ ...r, total: r.price + r.shipping }));
  const bestDeal = rows.reduce((a, b) => (b.score > a.score ? b : a));
  const cheapest = rows.reduce((a, b) => (b.total < a.total ? b : a));
  const fastest = rows.reduce((a, b) => (b.delivery < a.delivery ? b : a));
  return rows.map((r) => ({
    ...r,
    isBestDeal: r.store === bestDeal.store,
    isCheapest: r.store === cheapest.store,
    isFastest: r.store === fastest.store,
  }));
}

function searchCatalog(query, limit = 30) {
  const q = query.toLowerCase().trim();
  if (!q) return [];
  const terms = q.split(/\s+/).filter(Boolean);
  const scored = [];
  for (const p of CATALOG_LIST) {
    const haystack = `${p.brand} ${p.name} ${p.category} ${p.attrs.join(" ")}`.toLowerCase();
    let score = 0;
    for (const t of terms) if (haystack.includes(t)) score += t.length;
    if (score > 0) scored.push({ p, score });
  }
  scored.sort((a, b) => b.score - a.score || a.p.name.localeCompare(b.p.name));
  return scored.slice(0, limit).map((s) => s.p);
}

function getRecommendations(limit = 6) {
  const withSavings = CATALOG_LIST.map((p) => {
    const rows = annotate(p);
    const best = rows.find((r) => r.isBestDeal);
    const max = Math.max(...rows.map((r) => r.total));
    return { p, pct: (max - best.total) / max };
  });
  withSavings.sort((a, b) => b.pct - a.pct);
  return withSavings.slice(0, limit).map((x) => x.p);
}

function priceHistorySvg(history) {
  const w = 600, h = 180, padL = 34, padR = 8, padT = 10, padB = 20;
  const prices = history.prices;
  const min = Math.min(...prices), max = Math.max(...prices);
  const lo = min - (max - min || 1000) * 0.15, hi = max + (max - min || 1000) * 0.15;
  const n = prices.length;
  const x = (i) => padL + (i / (n - 1)) * (w - padL - padR);
  const y = (v) => padT + (1 - (v - lo) / (hi - lo)) * (h - padT - padB);
  const points = prices.map((p, i) => `${x(i).toFixed(1)},${y(p).toFixed(1)}`).join(" ");
  const grid = [0, 0.5, 1].map((f) => {
    const gy = padT + f * (h - padT - padB);
    const val = Math.round(hi - f * (hi - lo));
    return `<line x1="${padL}" y1="${gy}" x2="${w-padR}" y2="${gy}" style="stroke:var(--line)" stroke-dasharray="3,3"/>
      <text x="${padL-6}" y="${gy+4}" text-anchor="end" font-size="10" style="fill:var(--ink-muted)" font-family="var(--font-mono)">${Math.round(val/1000)}k</text>`;
  }).join("");
  const xLabels = history.labels.map((l, i) =>
    `<text x="${x(i).toFixed(1)}" y="${h-4}" text-anchor="middle" font-size="10" style="fill:var(--ink-muted)" font-family="var(--font-mono)">${l}</text>`
  ).join("");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:180px;display:block;">
    ${grid}
    <polyline points="${points}" fill="none" style="stroke:var(--ink)" stroke-width="2"/>
    ${xLabels}
  </svg>`;
}

const SEARCH_DURATION = 900;
let searchAnim = null;

function searchingHtml(product) {

  </section>`;

function startSearchAnimation(product) {
  const rows = annotate(product);
  const total = rows.length;
  const stopwatchEl = document.getElementById("stopwatch");
  const phaseEl = document.getElementById("search-phase");
  const rowsEl = document.getElementById("store-rows");
  const start = performance.now();

  function frame(now) {
    const t = Math.min(now - start, SEARCH_DURATION);
    stopwatchEl.textContent = (t / 1000).toFixed(2) + "s";
    phaseEl.textContent = t < SEARCH_DURATION * 0.4 ? "Checking every store" : t < SEARCH_DURATION * 0.8 ? "Comparing totals" : "Ranking the best deal";
    const revealed = Math.min(total, Math.ceil((t / SEARCH_DURATION) * total));
    let html = "";
    for (let i = 0; i < revealed; i++) {
      const r = rows[i];
      const isLast = i === revealed - 1 && revealed === total;
      html += `<div class="store-row ${isLast ? "winner" : ""}">
        <span style="font-size:14px;font-weight:500;">${esc(r.store)}</span>
        <span class="mono tabular muted" style="font-size:14px;">${egp(r.total)}</span>
      </div>`;
    }
    for (let i = 0; i < total - revealed; i++) html += `<div class="store-placeholder"></div>`;
    rowsEl.innerHTML = html;

    if (t < SEARCH_DURATION) {
      searchAnim = requestAnimationFrame(frame);
    } else {
      setTimeout(() => setState({ view: "results" }), 300);
    }
  }
  searchAnim = requestAnimationFrame(frame);
}

      ${priceHistorySvg(history)}
      <div class="stats-grid" style="margin-top:16px;">
        <div><div class="stat-label">Current</div><div class="stat-value tabular">${egp(current)}</div></div>
        <div><div class="stat-label">Lowest</div><div class="stat-value tabular">${egp(lowest)}</div></div>
        <div><div class="stat-label">Highest</div><div class="stat-value tabular">${egp(highest)}</div></div>
        <div><div class="stat-label">30-day avg</div><div class="stat-value tabular">${egp(avg)}</div></div>
      </div>
      <p style="font-size:14px;margin-top:12px;color:${isGood ? "var(--mint)" : "var(--ink-muted)"};">
        ${isGood ? `The current price is ${pctBelowAvg}% below the 30-day average.` : `The current price is at or above the 30-day average. It may be worth setting an alert instead.`}
      </p>
    </div>

    <div class="panel">
      <div class="panel-title">${icon("sparkles")} Quick's take</div>
      <p class="muted" style="font-size:14px;margin:0;">${buyVerdict}</p>
    </div>

    ${alertWidgetHtml(best.total)}
  </section>`;
}

/* ======================================================================
   VIEW: DASHBOARD
   ====================================================================== */
function dashboardHtml() {
  const totalSavings = CATALOG_LIST.reduce((sum, p) => {
    const rows = annotate(p);
    const best = rows.find((r) => r.isBestDeal);
    const max = Math.max(...rows.map((r) => r.total));
    return sum + (max - best.total);
  }, 0);

  const savedRows = state.savedIds.map((id) => {
    const p = PRODUCTS[id];
    if (!p) return "";
    const rows = annotate(p);
    const best = rows.find((r) => r.isBestDeal);
    return `<div class="list-row">
      <button class="list-row-btn" data-action="pick" data-id="${p.id}" data-name="${esc(p.name)}">
        ${icon(p.icon)}
        <div>
          <div style="font-size:14px;font-weight:500;">${esc(p.name)}</div>
          <div class="mono tabular muted" style="font-size:12px;">best: ${egp(best.total)} at ${esc(best.store)}</div>
        </div>
      </button>
      <button class="remove-btn" data-action="remove-saved" data-id="${p.id}">${icon("close")}</button>
    </div>`;
  }).join("");

  const alertRows = state.alerts.map((a) => `<tr>
    <td>${esc(a.name)}</td>
    <td class="num">${egp(a.current)}</td>
    <td class="num">${egp(a.target)}</td>
    <td style="text-align:right;"><span class="pill ${a.current <= a.target ? "mint" : ""}">${a.current <= a.target ? "Target reached" : "Watching"}</span></td>
  </tr>`).join("");

  return `
  <section class="results">
    <div>
      <h2 class="product-title">Your dashboard</h2>
      <p class="muted" style="font-size:14px;margin-top:6px;">Everything you're tracking with Quick, in one place.</p>
    </div>

    <div class="stats-grid">
      <div><div class="stat-label">Saved products</div><div class="stat-value tabular">${state.savedIds.length}</div></div>
      <div><div class="stat-label">Active alerts</div><div class="stat-value tabular">${state.alerts.length}</div></div>
      <div><div class="stat-label">Searches</div><div class="stat-value tabular">${state.searchHistory.length}</div></div>
      <div><div class="stat-label">Estimated savings found</div><div class="stat-value tabular" style="color:var(--mint);">${egp(totalSavings)}</div></div>
    </div>

    <div>
      <h3 style="font-size:18px;font-weight:600;margin:0 0 12px;">Saved products</h3>
      ${state.savedIds.length === 0
        ? `<p class="muted" style="font-size:14px;">Nothing saved yet. Save a product from its results page and Quick will track it here.</p>`
        : `<div style="display:flex;flex-direction:column;gap:8px;">${savedRows}</div>`}
    </div>

    <div>
      <h3 style="font-size:18px;font-weight:600;margin:0 0 12px;">Price alerts</h3>
      ${state.alerts.length === 0
        ? `<p class="muted" style="font-size:14px;">No alerts set. Create one from any product's results page and Quick will watch the price for you.</p>`
        : `<div class="table-wrap"><table class="comparison-table" style="min-width:480px;"><thead><tr><th>Product</th><th class="num">Current</th><th class="num">Target</th><th></th></tr></thead><tbody>${alertRows}</tbody></table></div>`}
    </div>

    <div>
      <h3 style="font-size:18px;font-weight:600;margin:0 0 12px;">Recent searches</h3>
      ${state.searchHistory.length === 0
        ? `<p class="muted" style="font-size:14px;">Your searches will show up here.</p>`
        : `<div class="row wrap gap-2">${state.searchHistory.map((q) => `<span class="pill">${esc(q)}</span>`).join("")}</div>`}
    </div>
  </section>`;
}

/* ======================================================================
   NAV + FOOTER
   ====================================================================== */
function navHtml() {
  return `
  <header class="navbar">
    <button class="brand" data-action="go-home">${logoSvg()}<span>Quick</span></button>
    <div class="row gap-2">
      <button class="nav-link ${state.view === "dashboard" ? "active" : ""}" data-action="go-dashboard">
        ${icon("dashboard")} Dashboard
        ${state.savedIds.length > 0 ? `<span class="badge-count mono tabular">${state.savedIds.length}</span>` : ""}
      </button>
      <button class="icon-btn" data-action="toggle-theme">${icon(state.isDark ? "sun" : "moon")}</button>
      <button class="btn btn-coral nav-cta" data-action="go-home">Start comparing</button>
    </div>
  </header>`;
}

function footerHtml() {
  return `
  <footer>
    <div class="footer-inner">
      <div class="row gap-2">${logoSvg(16)}<span style="font-size:14px;font-weight:600;">Quick</span></div>
      <p class="footer-note">Prototype interface running a simulated catalog and search API. Prices are illustrative, not live listings.</p>
    </div>
  </footer>`;
}

/* ======================================================================
   MAIN RENDER
   ====================================================================== */
function render() {
  document.documentElement.dataset.theme = state.isDark ? "dark" : "light";
  const app = document.getElementById("app");
  let body = "";

  if (state.view === "home") {
    body = heroHtml() + catalogSectionHtml() + recommendedSectionHtml() + howItWorksHtml() + trustNoteHtml();
  } else if (state.view === "understanding") {
    body = understandingHtml();
  } else if (state.view === "results-list") {
    body = resultsListHtml();
  } else if (state.view === "searching") {
    const product = PRODUCTS[state.activeProductId];
    body = product ? searchingHtml(product) : "";
  } else if (state.view === "results") {
    const product = PRODUCTS[state.activeProductId];
    body = product ? resultsHtml(product) : "";
  } else if (state.view === "dashboard") {
    body = dashboardHtml();
  }

  app.innerHTML = navHtml() + body + footerHtml();

  if (state.view === "searching") {
    const product = PRODUCTS[state.activeProductId];
    if (product) startSearchAnimation(product);
  }
}

/* ======================================================================
   ACTIONS
   ====================================================================== */
async function runSearch(q, forcedId) {
  state.query = q;
  state.searchHistory = [q, ...state.searchHistory.filter((x) => x !== q)].slice(0, 8);

  if (forcedId) {
    state.activeProductId = forcedId;
    state.sortMode = "best";
    state.alertCreated = false;
    setState({ view: "searching" });
    return;
  }

  setState({ view: "understanding" });
  const results = await simulateApi(() => searchCatalog(q, 30));
  if (results.length === 1) {
    state.activeProductId = results[0].id;
    state.sortMode = "best";
    state.alertCreated = false;
    setState({ view: "searching" });
  } else {
    setState({ searchResults: results, view: "results-list" });
  }
}

document.addEventListener("submit", (e) => {
  const form = e.target.closest('[data-form="search"]');
  if (!form) return;
  e.preventDefault();
  const q = form.querySelector('input[name="q"]').value.trim();
  if (q) runSearch(q);
});

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;

  if (action === "go-home") setState({ view: "home" });
  else if (action === "go-dashboard") setState({ view: "dashboard" });
  else if (action === "toggle-theme") setState({ isDark: !state.isDark });
  else if (action === "search-text") runSearch(el.dataset.q);
  else if (action === "filter-cat") setState({ catalogFilter: el.dataset.cat });
  else if (action === "sort-select") { /* handled by change listener */ }
  else if (action === "pick") runSearch(el.dataset.name, el.dataset.id);
  else if (action === "toggle-save") {
    const id = el.dataset.id;
    state.savedIds = state.savedIds.includes(id) ? state.savedIds.filter((x) => x !== id) : [...state.savedIds, id];
    render();
  }
  else if (action === "remove-saved") {
    state.savedIds = state.savedIds.filter((x) => x !== el.dataset.id);
    render();
  }
  else if (action === "set-alert") {
    const input = document.getElementById("alert-value");
    const val = Number(input.value);
    const product = PRODUCTS[state.activeProductId];
    const rows = annotate(product);
    const best = rows.find((r) => r.isBestDeal);
    state.alerts.push({ name: product.name, current: best.total, target: val });
    setState({ alertCreated: true, alertTarget: val });
  }
});

document.addEventListener("change", (e) => {
  if (e.target.matches('[data-action="sort-select"]')) {
    setState({ sortMode: e.target.value });
  }
});

/* ======================================================================
   INIT
   ====================================================================== */
render();
</script>
</body>
</html>
